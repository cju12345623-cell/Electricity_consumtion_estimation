<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>전력 사용량 예측 대시보드</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Electricity Forecast</p>
        <h1>전력 사용량 예측 대시보드</h1>
      </div>
      <a class="health" href="/health" target="_blank">API 상태</a>
    </header>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">Raw CSV + Trained Models</p>
          <h2>원하는 기간의 Actual과 모델 예측값을 바로 비교합니다.</h2>
        </div>
        <form id="predictForm" class="control-panel">
          <label class="file-picker">
            <span>Raw CSV</span>
            <input id="csvInput" type="file" accept=".csv,text/csv" required>
          </label>
          <label>
            <span>시작</span>
            <input id="startInput" type="datetime-local" required>
          </label>
          <label>
            <span>종료</span>
            <input id="endInput" type="datetime-local" required>
          </label>
          <button id="predictButton" type="submit">예측 실행</button>
        </form>
      </section>

      <section class="metrics" aria-label="요약 지표">
        <article><span>조회 행 수</span><strong id="rowCount">-</strong></article>
        <article><span>기간</span><strong id="periodText">-</strong></article>
        <article><span>Actual 평균</span><strong id="actualAvg">-</strong></article>
        <article><span>최고 수요</span><strong id="peakActual">-</strong></article>
      </section>

      <section class="chart-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Actual vs Forecast</p>
            <h2>모델별 예측 비교</h2>
          </div>
          <p id="statusText" class="status">CSV와 기간을 넣고 예측 실행을 누르세요.</p>
        </div>
        <canvas id="forecastChart" width="1200" height="460"></canvas>
        <div id="legend" class="legend"></div>
      </section>

      <section class="summary-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Model Evaluation</p>
            <h2>기간 평균 예측 결과</h2>
          </div>
          <p id="winnerText" class="status">예측 실행 후 모델별 평가가 표시됩니다.</p>
        </div>
        <div id="modelSummary" class="summary-grid"></div>
      </section>

      <section class="table-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Predictions</p>
            <h2>예측 결과 표</h2>
          </div>
          <p class="status">최대 300행만 표시합니다.</p>
        </div>
        <div class="table-wrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
